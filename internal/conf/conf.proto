syntax = "proto3";
package kratos.api;

option go_package = "github.com/itsping999/greeting/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  reserved 2;
  reserved "data";
}

message Server {
  message HTTP {
    bool enabled = 10;
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    bool enabled = 10;
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message RabbitMQ {
    string addr = 1;
    bool enabled = 10;
  }

  message Websocket {
    bool enabled = 10;
    string addr = 1;
    string path = 2;
    google.protobuf.Duration timeout = 3;
  }

  message MQTT {
    string addr = 1;
    bool enabled = 10;
  }

  message TCP {
    bool enabled = 10;
    string addr = 1;
    google.protobuf.Duration timeout = 2;
  }

  message UDP {
    bool enabled = 10;
    string addr = 1;
    google.protobuf.Duration timeout = 2;
  }

  message KCP {
    bool enabled = 10;
    string addr = 1;
    string key = 2;
    string salt = 3;
    google.protobuf.Duration timeout = 4;
  }

  HTTP http = 1;
  GRPC grpc = 2;
  RabbitMQ rabbitmq = 3;
  Websocket ws = 4;
  MQTT mqtt = 5;
  TCP tcp = 6;
  UDP udp = 7;
  KCP kcp = 8;
}
