apiVersion: v1
kind: Service
metadata:
  name: greeting
  labels:
    app.kubernetes.io/name: greeting
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: greeting
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 9000
      targetPort: grpc
